<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind — Анализ и Конспектирование</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>DocuMind</h1>

    <div class="tabs">
        <div class="tab active" id="normalTab">Обычный режим</div>
        <div class="tab" id="abstractTab">Конспектный режим</div>
        <div class="tab" id="videoTab">🎬 Видео режим</div>
    </div>

    <div class="video-input-container" id="videoInputContainer">
        <input type="text" id="videoLink" class="link-input" placeholder="Вставьте ссылку на видео (YouTube)">
        <button class="submit-btn" id="videoAnalyzeBtn">Анализировать видео</button>
    </div>

    <div class="upload-area" id="uploadArea">
        <i>📄</i>
        <p>Перетащите PDF-файл сюда или нажмите для выбора</p>
        <p class="small">Поддерживаемый формат: PDF</p>
        <input type="file" id="fileInput" accept=".pdf">
    </div>

    <div class="loading-container" id="loadingContainer">
        <div class="spinner"></div>
        <p id="loadingText">Обработка файла...</p>
    </div>

    <div class="file-info" id="fileInfo">
        <span class="file-name" id="fileName"></span>
        <button class="remove-file" id="removeFile">×</button>
    </div>

    <div id="message" class="message"></div>

    <div class="search-section" id="searchSection">
        <div class="search-input-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Введите ваш вопрос...">
            <button class="search-button" id="searchButton">Найти</button>
        </div>
    </div>

    <div class="results-container" id="resultsContainer">
        <div id="searchResults"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const tabs = {
            normal: document.getElementById('normalTab'),
            abstract: document.getElementById('abstractTab'),
            video: document.getElementById('videoTab')
        };
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loadingContainer = document.getElementById('loadingContainer');
        const loadingText = document.getElementById('loadingText');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const removeFile = document.getElementById('removeFile');
        const searchSection = document.getElementById('searchSection');
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('resultsContainer');
        const searchResults = document.getElementById('searchResults');
        const message = document.getElementById('message');
        const baseUrl = 'http://localhost:8080';
        const baseUrlV = 'http://localhost:1488';

        const videoInputContainer = document.getElementById('videoInputContainer');
        const videoLinkInput = document.getElementById('videoLink');
        const videoAnalyzeBtn = document.getElementById('videoAnalyzeBtn');
        let currentVideoLink = null;

        let mode = 'normal';
        let currentFile = null;
        let docId = null;

        Object.keys(tabs).forEach(key => tabs[key].addEventListener('click', () => switchMode(key)));

        function switchMode(m) {
            mode = m;
            Object.values(tabs).forEach(tab => tab.classList.remove('active'));
            tabs[m].classList.add('active');
            resetUI();

            if (m === 'video') {
                uploadArea.style.display = 'none';
                videoInputContainer.style.display = 'flex';
                message.textContent = 'Видео режим — вставьте ссылку на видео.';
            } else {
                videoInputContainer.style.display = 'none';
                uploadArea.style.display = 'block';
                message.textContent = (m === 'normal')
                    ? 'Обычный режим — задавайте конкретные вопросы по документу.'
                    : 'Конспектный режим — создаёт развернутые обобщения и конспекты.';
            }
        }

        videoAnalyzeBtn.addEventListener('click', () => {
            const link = videoLinkInput.value.trim();
            if (!link) return alert('Введите ссылку на видео!');
            currentVideoLink = link;

            loadingContainer.style.display = 'flex';
            loadingText.textContent = 'Анализируем видео...';

            fetch(`${baseUrlF}/video/load-link`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify({ link })
            })
            .then(r => r.text())
            .then(text => {
                loadingContainer.style.display = 'none';
                message.textContent = text || 'Видео обработано!';
                message.className = 'message success';
                searchSection.style.display = 'block';
            })
            .catch(() => {
                loadingContainer.style.display = 'none';
                message.textContent = 'Ошибка при анализе видео.';
                message.className = 'message error';
            });
        });

        fileInput.addEventListener('change', e => e.target.files.length && handleFileUpload(e.target.files[0]));
        removeFile.addEventListener('click', resetUI);
        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', e => e.key === 'Enter' && performSearch());

        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return alert('Введите вопрос');

            loadingContainer.style.display = 'flex';
            loadingText.textContent = 'Формируем ответ...';

            let endpoint;
            let body;

            if (mode === 'video') {
                endpoint = '/video/search-video';
                body = { link: currentVideoLink, question: query };
            } else {
                endpoint = mode === 'normal' ? '/search' : '/abstract-search';
                body = { question: query, docId };
            }

            fetch(`${baseUrlV}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify(body),
                mode: 'cors'
            })
            .then(r => r.text())
            .then(data => {
                loadingContainer.style.display = 'none';
                displayResult(data);
            })
            .catch(() => {
                loadingContainer.style.display = 'none';
                message.textContent = 'Ошибка при поиске.';
                message.className = 'message error';
            });
        }

        function displayResult(result) {
            resultsContainer.style.display = 'block';
            searchResults.innerHTML = `<div class="result-item"><p>${result || 'Ничего не найдено'}</p></div>`;
            message.textContent = 'Поиск завершён!';
            message.className = 'message success';
        }

        function resetUI() {
            fileInfo.style.display = 'none';
            searchSection.style.display = 'none';
            resultsContainer.style.display = 'none';
            uploadArea.style.display = (mode !== 'video') ? 'block' : 'none';
            message.textContent = '';
            searchInput.value = '';
            searchResults.innerHTML = '';
        }

        function handleFileUpload(file) {
            currentFile = file;
            fileName.textContent = file.name;
            fileInfo.style.display = 'block';
            loadingContainer.style.display = 'flex';
            loadingText.textContent = 'Загружаем файл...';

            const formData = new FormData();
            formData.append('file', file);

            fetch(`${baseUrl}/load-pdf?docId=${crypto.randomUUID()}`, { method: 'POST', body: formData })
                .then(response => response.text())
                .then(id => {
                    docId = id;
                    loadingContainer.style.display = 'none';
                    message.textContent = 'Файл успешно загружен!';
                    message.className = 'message success';
                    searchSection.style.display = 'block';
                })
                .catch(() => {
                    loadingContainer.style.display = 'none';
                    message.textContent = 'Ошибка при загрузке файла.';
                    message.className = 'message error';
                });
        }
    });
</script>
</body>
</html>
